set -g @resurrect-post-restore-hook 'source-file ~/.tmux.conf'

set -g default-terminal "xterm-256color"
# tmux 3.5+ supports this; -q keeps the config usable on Ubuntu's tmux 3.4.
set -gq extended-keys-format csi-u

# Sync tmux clipboard with system clipboard
set -g set-clipboard on

set -g focus-events on
set -sg escape-time 10
set -sq extended-keys on
set -as terminal-features 'xterm-256color:extkeys'

set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

unbind '%'
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind _ split-window -v -c "#{pane_current_path}"

unbind r
set -g @config-path "$HOME/.tmux.conf"
bind r source-file "$HOME/.tmux.conf" \; display-message "Reloaded #{@config-path}"

bind -r j resize-pane -D 30
bind -r k resize-pane -U 30
bind -r l resize-pane -R 30
bind -r h resize-pane -L 30

# Focused column gets at least 50%; other columns share the remainder evenly.
# Rebuild the layout: resize-pane alone steals space unevenly from neighbors.
# Minimize mode and zoom are handled by the helper.
set-hook -g window-pane-changed {
    run-shell 'python3 "$HOME/.local/share/dotfiles/config/shared/tmux-balance-panes.py" "#{hook_window}"'
}
set-hook -g after-split-window {
    run-shell 'python3 "$HOME/.local/share/dotfiles/config/shared/tmux-balance-panes.py" "#{window_id}"'
}
set-hook -g after-kill-pane {
    run-shell 'python3 "$HOME/.local/share/dotfiles/config/shared/tmux-balance-panes.py" "#{window_id}"'
}
set-hook -g window-resized {
    run-shell 'python3 "$HOME/.local/share/dotfiles/config/shared/tmux-balance-panes.py" "#{hook_window}"'
}

# Alt+m: toggle minimize mode for this window; restore its layout when disabled.
bind -n M-m run-shell 'window="#{window_id}"; if [ "$(tmux show-options -wqv -t "$window" @pane-minimize)" = on ]; then tmux set-option -w -t "$window" @pane-minimize off; layout=$(tmux show-options -wqv -t "$window" @pane-before-minimize); if [ -n "$layout" ]; then tmux select-layout -t "$window" "$layout"; fi; tmux display-message "Pane minimize OFF (50% minimum)"; else layout=$(tmux display-message -p -t "$window" "##{window_layout}"); tmux set-option -w -t "$window" @pane-before-minimize "$layout"; tmux set-option -w -t "$window" @pane-minimize on; tmux display-message "Pane minimize ON"; fi; tmux set-hook -R -t "$window" window-pane-changed'

# Alt++ (no prefix): make the focused pane half the window width.
bind -n M-+ resize-pane -x 50%

# Alt+= (no prefix): equal-width columns; disable minimize mode so it stays usable.
bind -n M-= set-option -w @pane-minimize off \; select-layout even-horizontal

bind -r z resize-pane -Z # m is reserved for mouse toggle

set-window-option -g mode-keys vi

# Mouse on by default. Toggle: Ctrl-Space m
set -g mouse on
bind m if -F "#{mouse}" "set -g mouse off; display-message 'Mouse OFF'" "set -g mouse on; display-message 'Mouse ON'"

# Enter copy mode (scroll history)
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @themepack 'powerline/default/cyan' # use this theme for tmux

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Initialize TMUX plugin manager (Needs to be last plugin)
if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'

# Direction keys: h/j/k/l = left/down/up/right (no prefix).
# Ctrl focuses tmux panes; Ctrl+Shift focuses i3 windows (configured in i3).
# At the edge pane, hand off to the window manager so focus crosses into the
# neighbouring terminal window.
bind-key -n C-h if -F '#{pane_at_left}'   "run-shell -b 'aerospace focus left  2>/dev/null || i3-msg -q focus left 2>/dev/null; true'"  'select-pane -L'
bind-key -n C-j if -F '#{pane_at_bottom}' "run-shell -b 'aerospace focus down  2>/dev/null || i3-msg -q focus down 2>/dev/null; true'"  'select-pane -D'
bind-key -n C-k if -F '#{pane_at_top}'    "run-shell -b 'aerospace focus up    2>/dev/null || i3-msg -q focus up 2>/dev/null; true'"    'select-pane -U'
bind-key -n C-l if -F '#{pane_at_right}'  "run-shell -b 'aerospace focus right 2>/dev/null || i3-msg -q focus right 2>/dev/null; true'" 'select-pane -R'
bind-key -n C-Bspace select-pane -L

# Alt swaps the active pane with its directional neighbor and follows it.
# Explicit source avoids accidentally moving a marked pane instead.
# Alt+Shift moves i3 windows (configured in i3).
bind-key -n M-h swap-pane -d -s '{active}' -t '{left-of}'
bind-key -n M-j swap-pane -d -s '{active}' -t '{down-of}'
bind-key -n M-k swap-pane -d -s '{active}' -t '{up-of}'
bind-key -n M-l swap-pane -d -s '{active}' -t '{right-of}'

# Dim inactive panes (after tpm so themepack doesn't override)
set -g window-style 'fg=colour246'
# 'default' is compatible with Ubuntu's tmux 3.4 as well as newer releases.
set -g window-active-style 'fg=default'

# Auto-fix focus after pane/window switch (workaround for lost focus events)
set-hook -g pane-focus-in 'select-pane -P fg=default'
set-hook -g pane-focus-out 'select-pane -P fg=colour246'

#Sort alphabetically
bind s choose-session -Z -O name

# Keep tmux's discovered login shell; do not assume zsh is in /usr/bin.
set-option -g default-command ""
source-file -q ~/.config/dotfiles/machine.tmux.conf
source-file -q ~/.config/dotfiles/tmux.local.conf
