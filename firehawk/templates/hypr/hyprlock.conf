general {
    hide_cursor = true
}
background {
    monitor =
    path = @@wallpaper@@
    blur_passes = 1
    blur_size = 4
}
input-field {
    monitor =
    size = 320, 54
    position = 0, -250
    outline_thickness = 2
    outer_color = rgb(@@orange_hex@@)
    inner_color = rgb(@@panel_hex@@)
    font_color = rgb(@@white_hex@@)
    placeholder_text = Authenticate
    fail_color = rgb(@@alert_hex@@)
}
label {
    monitor =
    text = @@name@@ // EMBER
    color = rgb(@@white_hex@@)
    font_size = 24
    font_family = Noto Sans Mono
    position = 0, -160
}
label {
    monitor =
    text = $TIME
    color = rgb(@@orange_hex@@)
    font_size = 64
    font_family = Noto Sans Mono
    position = 0, 240
}
